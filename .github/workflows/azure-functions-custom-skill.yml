name: Azure Functions Custom Skill CI/CD

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/azure-functions-custom-skill.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/azure-functions-custom-skill.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate function source
        run: npm run validate

      - name: Azure login
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_FUNCTIONAPP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_FUNCTIONAPP_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_FUNCTIONAPP_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        if: github.event_name != 'pull_request'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: .